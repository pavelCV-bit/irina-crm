<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>База клиентов</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { -webkit-tap-highlight-color: transparent; }
  .dot-green { background:#22c55e; }
  .dot-yellow { background:#eab308; }
  .dot-red { background:#ef4444; }
</style>
</head>
<body class="bg-gray-50 min-h-screen pb-24">

  <div class="max-w-md mx-auto p-4">
    <h1 class="text-xl font-bold mb-3">Мои клиенты</h1>

    <!-- Счётчик спящих клиентов -->
    <div id="alertBanner" class="hidden mb-4 p-3 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm font-medium">
    </div>

    <!-- Фильтры -->
    <div id="filters" class="flex gap-2 mb-4 overflow-x-auto whitespace-nowrap"></div>

    <!-- Список клиентов -->
    <div id="clientList" class="space-y-3"></div>
  </div>

  <!-- Кнопка добавления -->
  <button onclick="openAddModal()" class="fixed bottom-6 right-6 bg-blue-600 text-white rounded-full w-14 h-14 text-2xl shadow-lg flex items-center justify-center">+</button>

  <!-- Модалка добавления -->
  <div id="addModal" class="hidden fixed inset-0 bg-black/40 flex items-end z-50">
    <div class="bg-white w-full rounded-t-2xl p-5 space-y-3">
      <h2 class="font-bold text-lg">Новый клиент</h2>
      <button onclick="requestContactTG()" class="w-full py-2 bg-gray-100 rounded-lg text-sm font-medium">📇 Выбрать контакт</button>
      <input id="fName" placeholder="Имя" class="w-full border rounded-lg p-2">
      <input id="fPhone" placeholder="Телефон (79991234567)" class="w-full border rounded-lg p-2">
      <select id="fCategory" class="w-full border rounded-lg p-2">
        <option>Бодифлекс</option>
        <option>Йога</option>
        <option>Массаж спины</option>
        <option>Другое</option>
      </select>
      <textarea id="fNotes" placeholder="Заметка (необязательно)" class="w-full border rounded-lg p-2"></textarea>
      <div class="flex gap-2 pt-2">
        <button onclick="closeAddModal()" class="flex-1 py-2 rounded-lg bg-gray-100">Отмена</button>
        <button onclick="saveClient()" class="flex-1 py-2 rounded-lg bg-blue-600 text-white">Сохранить</button>
      </div>
    </div>
  </div>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready();
tg?.expand();

const API = "/api";
let currentFilter = null;
let allClients = [];

async function loadStats() {
  const r = await fetch(`${API}/stats`);
  const s = await r.json();
  const banner = document.getElementById("alertBanner");
  if (s.red > 0) {
    banner.classList.remove("hidden");
    banner.textContent = `⚠️ ${s.red} ${plural(s.red)} не был${s.red===1?'':'и'} больше 30 дней — пора напомнить о себе`;
  } else {
    banner.classList.add("hidden");
  }
}

function plural(n) {
  return n === 1 ? "клиент" : (n < 5 ? "клиента" : "клиентов");
}

async function loadClients() {
  const url = currentFilter ? `${API}/clients?category=${encodeURIComponent(currentFilter)}` : `${API}/clients`;
  const r = await fetch(url);
  allClients = await r.json();
  renderFilters();
  renderList();
  loadStats();
}

function renderFilters() {
  const categories = ["Все", "Бодифлекс", "Йога", "Массаж спины"];
  const el = document.getElementById("filters");
  el.innerHTML = categories.map(c => {
    const active = (c === "Все" && !currentFilter) || c === currentFilter;
    return `<button onclick="setFilter('${c === "Все" ? "" : c}')"
      class="px-3 py-1 rounded-full text-sm ${active ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-700'}">${c}</button>`;
  }).join("");
}

function setFilter(cat) {
  currentFilter = cat || null;
  loadClients();
}

function renderList() {
  const el = document.getElementById("clientList");
  if (allClients.length === 0) {
    el.innerHTML = `<p class="text-gray-400 text-center py-10">Пока пусто — добавьте первого клиента</p>`;
    return;
  }
  el.innerHTML = allClients.map(c => `
    <div class="bg-white rounded-xl p-4 shadow-sm flex items-center gap-3">
      <div class="w-3 h-3 rounded-full dot-${c.status} flex-shrink-0"></div>
      <div class="flex-1 min-w-0">
        <div class="font-semibold">${escapeHtml(c.name)}</div>
        <div class="text-xs text-gray-500">${escapeHtml(c.category)} · был ${c.days_since} дн. назад</div>
        ${c.notes ? `<div class="text-xs text-gray-400 mt-0.5">${escapeHtml(c.notes)}</div>` : ""}
      </div>
      <div class="flex flex-col gap-1">
        <button onclick="markVisit(${c.id})" class="text-xs bg-green-50 text-green-700 px-2 py-1 rounded-lg font-medium">+1 Сеанс</button>
        <button onclick="openWhatsapp('${c.phone}', '${escapeHtml(c.name)}')" class="text-xs bg-emerald-50 text-emerald-700 px-2 py-1 rounded-lg font-medium">WhatsApp</button>
      </div>
    </div>
  `).join("");
}

function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

async function markVisit(id) {
  await fetch(`${API}/clients/${id}/visit`, { method: "PATCH" });
  tg?.HapticFeedback?.notificationOccurred("success");
  loadClients();
}

function openWhatsapp(phone, name) {
  const text = encodeURIComponent(`Привет, ${name}! Давно вас не было на занятиях — есть свободные места, приходите 🙌`);
  const clean = phone.replace(/[^\d]/g, "");
  window.open(`https://wa.me/${clean}?text=${text}`, "_blank");
}

function openAddModal() { document.getElementById("addModal").classList.remove("hidden"); }
function closeAddModal() { document.getElementById("addModal").classList.add("hidden"); }

function requestContactTG() {
  tg?.requestContact?.((shared, contact) => {
    if (shared && contact) {
      document.getElementById("fName").value = `${contact.first_name || ""} ${contact.last_name || ""}`.trim();
      document.getElementById("fPhone").value = contact.phone_number || "";
    }
  });
}

async function saveClient() {
  const name = document.getElementById("fName").value.trim();
  const phone = document.getElementById("fPhone").value.trim();
  const category = document.getElementById("fCategory").value;
  const notes = document.getElementById("fNotes").value.trim();
  if (!name || !phone) { alert("Заполните имя и телефон"); return; }

  await fetch(`${API}/clients`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name, phone, category, notes, owner_tg_id: tg?.initDataUnsafe?.user?.id || 0 })
  });
  closeAddModal();
  document.getElementById("fName").value = "";
  document.getElementById("fPhone").value = "";
  document.getElementById("fNotes").value = "";
  loadClients();
}

loadClients();
</script>
</body>
</html>
